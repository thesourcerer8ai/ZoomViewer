[package]
name = "nand-flash-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
qoi = "0.4"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
num_cpus = "1.16"
fltk = { version = "1.4", features = ["fltk-bundled"] }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
