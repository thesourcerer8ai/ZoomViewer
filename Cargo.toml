[package]
name = "nand-flash-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
qoi = "0.4"
image = "0.25"
imageproc = { version = "0.26.1", features = ["text"] }
ab_glyph = "0.2"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
num_cpus = "1.16"
fltk = { version = "1.5.23", features = ["enable-glwindow"] }
egui = "0.27"
egui_glow = "0.27"
fltk-egui = "0.16"
serialport = "4.3"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.14", default-features = false }
libc = "0.2"

# Windows: WinFsp is the Windows counterpart of the FUSE kernel module.
# The `winfsp-sys` crate is vendored under `vendor/` (patched to use its
# pre-generated bindings, so no libclang/LLVM is needed to build).
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", features = ["system"] }
winfsp-sys = "0.12.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", features = ["system"] }

[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }

[profile.dev]
opt-level = 3
